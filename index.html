<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>repcse v3</title>
<style>
body{margin:0;font-family:monospace;background:#fff;color:#000;display:flex;justify-content:center;align-items:center;height:100vh}
#app{width:300px;height:200px;border:1px solid #000;display:flex;flex-direction:column;background:#fff}
header{padding:3px 5px;border-bottom:1px solid #000;font-weight:bold;text-align:center;font-size:14px}
#screen{flex:1;overflow-y:auto;padding:5px;font-size:12px}
section{display:none;margin-bottom:5px}
section p{margin:2px 0}
nav{display:flex;border-top:1px solid #000;font-size:10px}
nav a{flex:1;text-align:center;padding:2px 0;text-decoration:none;color:#000;border-right:1px solid #000;opacity:.5;pointer-events:none}
nav a:last-child{border-right:none}
nav a.active{opacity:1;pointer-events:auto}
a.action{color:blue;text-decoration:underline;cursor:pointer;font-size:11px}
.message{font-size:10px;margin:2px 0}
.msg-error{color:red}.msg-success{color:green}.msg-info{color:blue}
table{width:100%;font-size:12px;border-collapse:collapse}
td{padding:2px}
.mod-data-wrapper{display:flex;gap:10px}
.mod-left,.mod-right{width:50%}
.input-row{display:flex;gap:6px;align-items:center}
.listing{font-size:12px;margin:2px 0}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
<header>repcse</header>
<div id="screen">

<!-- HOME -->
<section id="mod-home">
<p><strong>register / load</strong></p>
<input id="signup-password" type="password" maxlength="6" placeholder="enter password (max 6 digits)">
<p><a class="action" onclick="signup()">sign up</a> | <a class="action" onclick="loadFileBtn()">load</a></p>
</section>

<!-- SHOP -->
<section id="mod-shop">
<p><strong>shop</strong></p>
<div id="shop-list"></div>
</section>

<!-- BIZ -->
<section id="mod-biz">
<p><strong>online business</strong></p>
<div>
<p><strong>inventory</strong></p>
<div id="biz-inv"></div>
<p><strong>listings</strong></p>
<div id="biz-listings"></div>
</div>
</section>

<!-- WORK -->
<section id="mod-work">
<p><strong>work</strong></p>
<table>
<tr><td>item:</td><td id="job-item">-</td></tr>
<tr><td>receiver:</td><td id="job-receiver">-</td></tr>
<tr><td>wage:</td><td id="job-wage">-</td></tr>
<tr><td>cost(buzz):</td><td id="job-buzzcost">-</td></tr>
</table>
<p><a class="action" onclick="deliverJob()">deliver</a></p>
</section>

<!-- DATA -->
<section id="mod-data">
<p><strong>user data</strong></p>
<div class="mod-data-wrapper">
 <div class="mod-left">
  <p>tag: <span id="player-tag">-</span></p>
  <p>cr: <span id="player-cr">0.00</span></p>
  <p>level: <span id="player-level">1</span></p>
  <p>date: <span id="player-date">-</span></p>
  <p>days: <span id="player-days">0</span></p>
  <p><a class="action" onclick="confirmReset()">reset</a> | <a class="action" onclick="saveData()">save</a> | <a class="action" onclick="loadFileBtn()">load</a></p>
 </div>
 <div class="mod-right">
  <p>buzz: <span id="player-buzz">37</span></p>
  <p>total jobs: <span id="player-totaljobs">0</span></p>
 </div>
</div>
</section>

<!-- RELAX -->
<section id="mod-relax">
<p><strong>relax</strong></p>
<div style="text-align:center;margin-top:20px">
<a class="action" id="relax-btn" onclick="startRelax()">relax</a>
<p id="relax-timer" style="display:none;font-size:12px">10 second...</p>
</div>
</section>

</div>

<!-- NAV -->
<nav>
<a id="nav-shop" onclick="showMod('mod-shop')">shop</a>
<a id="nav-biz" onclick="showMod('mod-biz')">biz</a>
<a id="nav-work" onclick="showMod('mod-work')">work</a>
<a id="nav-data" onclick="showMod('mod-data')">data</a>
<a id="nav-relax" onclick="showMod('mod-relax')">relax</a>
</nav>
</div>

<input type="file" id="load-file" accept=".txt" onchange="loadFromFile(event)">

<script>
/* CONFIG */
const MAX_BUZZ=37,MAX_LEVEL=50,RELAX_COST=.12,RELAX_GAIN=5,RELAX_SECONDS=10;
const BUYER_INTERVAL_MS=5000,BUYER_CHANCE=0.5; // 50% every 5s
const PRODUCTS=[
 {id:'snack',name:'snack',buy:0.30,sell:0.60},
 {id:'drink',name:'drink',buy:0.50,sell:1.00},
 {id:'gadget',name:'gadget',buy:1.20,sell:2.40},
];

/* HELPERS */
const getPlayer=()=>JSON.parse(localStorage.getItem('player')||'null');
const savePlayer=p=>localStorage.setItem('player',JSON.stringify(p));
const generateChecksum=p=>btoa((p.tag||'')+'|'+p.level+'|'+Number(p.cr||0).toFixed(2));
const validateChecksum=p=>p&&p.check===generateChecksum(p);

/* INIT */
function initPlayer(){
 const p=getPlayer();
 if(!p){showMod('mod-home');disableNav();}else{enableNav();updateUI();showMod('mod-data');document.getElementById('mod-home').style.display='none'}
 renderShop(); renderBiz(); setInterval(updateDays,1000); setInterval(buyerTick,BUYER_INTERVAL_MS);
}
function disableNav(){document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'),a=>a.style.pointerEvents='none'); document.querySelectorAll('nav a').forEach(a=>a.style.opacity=.5)}
function enableNav(){document.querySelectorAll('nav a').forEach(a=>a.style.opacity=1); document.querySelectorAll('nav a').forEach(a=>a.style.pointerEvents='auto')}

/* SIGNUP */
function signup(){
 const pw=document.getElementById('signup-password').value.trim();
 if(!pw||pw.length>6) return printMessage('invalid password!','error');
 const tag=String(Math.floor(3+Math.random()*997)).padStart(3,'0'),today=new Date();
 const player={version:1,tag,password:pw,cr:10,level:1,exp:0,date:today.toLocaleDateString(),signupTime:today.getTime(),buzz:MAX_BUZZ,totalJobs:0,inventory:{},listings:[]};
 player.check=generateChecksum(player); savePlayer(player); updateUI(); enableNav(); showMod('mod-data'); document.getElementById('mod-home').style.display='none';
 printMessage('registration successful!','success'); renderBiz(); renderShop();
}

/* UI UPDATES */
function updateUI(){
 const p=getPlayer(); if(!p) return;
 document.getElementById('player-tag').textContent=p.tag;
 document.getElementById('player-cr').textContent=Number(p.cr||0).toFixed(2);
 document.getElementById('player-level').textContent=p.level;
 document.getElementById('player-date').textContent=p.date;
 updateDays();
 document.getElementById('player-buzz').textContent=p.buzz;
 document.getElementById('player-totaljobs').textContent=p.totalJobs||0;
 if(p.activeJob){
  document.getElementById('job-item').textContent=p.activeJob.item||p.activeJob.type;
  document.getElementById('job-receiver').textContent=p.activeJob.receiver;
  document.getElementById('job-wage').textContent=Number(p.activeJob.wage).toFixed(2)+' cr';
  document.getElementById('job-buzzcost').textContent=p.activeJob.buzzCost;
 } else { ['job-item','job-receiver','job-wage','job-buzzcost'].forEach(id=>document.getElementById(id).textContent='-'); }
 renderBiz();
}

/* DAYS */
function updateDays(){ const p=getPlayer(); if(!p) return; const days=p.signupTime?Math.floor((Date.now()-p.signupTime)/86400000):0; document.getElementById('player-days').textContent=days; }

/* MESSAGES */
function printMessage(msg,type='info'){ document.querySelectorAll('.message').forEach(n=>n.remove()); const active=[...document.querySelectorAll('#screen>section')].find(s=>s.style.display!=='none'); if(!active) return; const p=document.createElement('p'); p.className='message msg-'+type; p.innerHTML=msg; active.appendChild(p); active.scrollTop=active.scrollHeight; }

/* SHOP */
function renderShop(){
 const c=document.getElementById('shop-list'); c.innerHTML='';
 PRODUCTS.forEach(pr=>{ const p=document.createElement('p'); p.innerHTML=`${pr.name} - ${pr.buy.toFixed(2)} cr <a class="action" onclick="buyFromShop('${pr.id}')">buy</a>`; c.appendChild(p); });
}
function buyFromShop(id){
 const p=getPlayer(); if(!p) return;
 const prod=PRODUCTS.find(x=>x.id===id); if(!prod) return;
 if(Number(p.cr||0) < prod.buy) return printMessage('not enough cr!','error');
 p.cr = Number(p.cr||0) - prod.buy;
 p.inventory = p.inventory || {};
 p.inventory[id] = (p.inventory[id]||0) + 1;
 p.check=generateChecksum(p); savePlayer(p); updateUI(); renderBiz(); printMessage(`bought ${prod.name}`,'success');
}

/* BIZ */
function renderBiz(){
 const p=getPlayer(); if(!p) return;
 const invBox=document.getElementById('biz-inv'), lisBox=document.getElementById('biz-listings');
 invBox.innerHTML=''; lisBox.innerHTML='';
 const inv=p.inventory||{};
 if(Object.keys(inv).length===0) invBox.innerHTML='<p>- no inventory -</p>';
 else Object.entries(inv).forEach(([id,qty])=>{
  const prod=PRODUCTS.find(x=>x.id===id);
  const el=document.createElement('p'); el.className='listing';
  el.innerHTML=`${prod.name} x${qty} <a class="action" onclick="listForSale('${id}')">list</a>`;
  invBox.appendChild(el);
 });
 if(!p.listings||p.listings.length===0) lisBox.innerHTML='<p>- no listings -</p>';
 else p.listings.forEach((L,i)=>{ const prod=PRODUCTS.find(x=>x.id===L.id); const el=document.createElement('p'); el.className='listing'; el.innerHTML=`${prod.name} → ${L.sell.toFixed(2)} cr <a class="action" onclick="cancelListing(${i})">cancel</a>`; lisBox.appendChild(el); });
}
function listForSale(id){
 const p=getPlayer(); if(!p) return;
 p.inventory=p.inventory||{}; if(!p.inventory[id]||p.inventory[id]<=0) return printMessage('no item to list!','error');
 const prod=PRODUCTS.find(x=>x.id===id);
 p.inventory[id]--; if(p.inventory[id]<=0) delete p.inventory[id];
 p.listings=p.listings||[]; p.listings.push({id:prod.id,sell:prod.sell,posted:Date.now()});
 p.check=generateChecksum(p); savePlayer(p); updateUI(); renderBiz(); printMessage('product listed!','success');
}
function cancelListing(idx){
 const p=getPlayer(); if(!p||!p.listings) return;
 const L=p.listings.splice(idx,1)[0]; if(L){ p.inventory=L.id ? (p.inventory||{}) : p.inventory; p.inventory[L.id]=(p.inventory[L.id]||0)+1; p.check=generateChecksum(p); savePlayer(p); updateUI(); renderBiz(); printMessage('listing cancelled','info'); }
}

/* BUYER TICK */
function buyerTick(){
 const p=getPlayer(); if(!p||!p.listings||p.listings.length===0) return;
 if(p.activeJob) return; // only one pending delivery at a time
 if(Math.random() < BUYER_CHANCE){
  // sell oldest listing
  const listing = p.listings.shift();
  const receiver=String(Math.floor(3+Math.random()*997)).padStart(3,'0');
  p.activeJob={type:'delivery',item:listing.id,receiver,wage:listing.sell,buzzCost:1};
  p.check=generateChecksum(p); savePlayer(p); updateUI(); printMessage(`buyer purchased ${listing.id}! order pending delivery`,'success');
 }
}

/* WORK (deliver only) */
function deliverJob(){
 const p=getPlayer(); if(!p) return;
 if(!p.activeJob) return printMessage('no active job!','error');
 if((p.buzz||0) < p.activeJob.buzzCost) return printMessage('not enough buzz to deliver!','error');
 // spend buzz, grant cr and exp
 p.buzz = Math.max(0,(p.buzz||0) - p.activeJob.buzzCost);
 p.cr = Number(p.cr||0) + Number(p.activeJob.wage||0);
 p.totalJobs = (p.totalJobs||0) + 1;
 // exp reward random 1-5
 const expGain = Math.floor(Math.random()*5)+1;
 p.exp = (p.exp||0) + expGain;
 while(p.exp >= p.level*100 && p.level < MAX_LEVEL){ p.exp -= p.level*100; p.level++; printMessage('[level up!]','success'); }
 delete p.activeJob;
 p.check=generateChecksum(p); savePlayer(p); updateUI(); printMessage('delivery completed!','success');
}

/* RESET/SAVE/LOAD */
function confirmReset(){ printMessage('delete all data? <a class="action" onclick="resetData()">[yes]</a>','info') }
function resetData(){ localStorage.removeItem('player'); showMod('mod-home'); disableNav(); ['job-item','job-receiver','job-wage','job-buzzcost'].forEach(id=>document.getElementById(id).textContent='-'); printMessage('all data reset. please sign up or load.','info') }
function saveData(){ const p=getPlayer(); if(!p) return; p.check=generateChecksum(p); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(p)],{type:'text/plain'})); a.download='repcse_data.txt'; a.click(); }
function loadFileBtn(){ document.getElementById('load-file').click(); }
function loadFromFile(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=x=>{ try{ const d=JSON.parse(x.target.result); if(!validateChecksum(d)) return printMessage('invalid or modified file!','error'); localStorage.setItem('player',JSON.stringify(d)); enableNav(); showMod('mod-data'); updateUI(); document.getElementById('mod-home').style.display='none'; printMessage('data loaded successfully!','success'); }catch{ printMessage('invalid file format!','error') } }; r.readAsText(f); e.target.value=''; }

/* RELAX */
let relaxActive=false,relaxInterval=null;
function startRelax(){
 if(relaxActive) return;
 const p=getPlayer(); if(!p) return;
 p.cr = Number(p.cr||0) - RELAX_COST; p.check=generateChecksum(p); savePlayer(p); updateUI();
 relaxActive=true; document.getElementById('relax-btn').style.display='none'; const tm=document.getElementById('relax-timer'); tm.style.display='block';
 let t=RELAX_SECONDS; tm.textContent=t+' second...';
 relaxInterval=setInterval(()=>{ t--; tm.textContent=t+' second...'; if(t<=0){ clearInterval(relaxInterval); finishRelax(); } },1000);
}
function finishRelax(){
 relaxActive=false; const p=getPlayer(); if(!p) return;
 p.buzz = Math.min(MAX_BUZZ, Number(p.buzz||0) + RELAX_GAIN);
 p.check=generateChecksum(p); savePlayer(p); updateUI(); printMessage('you feel refreshed! +5 buzz','success');
 document.getElementById('relax-btn').style.display='inline'; document.getElementById('relax-timer').style.display='none';
}

/* NAV / SHOW */
function showMod(id){ document.querySelectorAll('#screen>section').forEach(s=>s.style.display='none'); document.getElementById(id).style.display='block'; }

/* START */
window.onload=initPlayer;
</script>
</body>
</html>
